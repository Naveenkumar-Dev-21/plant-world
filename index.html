<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant-World</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script&family=Alex+Brush&family=Cormorant+Garamond&family=Cinzel&family=Playfair+Display&family=Lora&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="photos/KSRCT_LOGO_2.png" alt="KSR College of Technology">
        </div>

        <div class="main-content">
            <h1 class="project-title"><span>P</span><span>l</span><span>a</span><span>n</span><span>t</span><span>W</span><span>o</span><span>r</span><span>l</span><span>d</span></h1>
            
            <div class="project-description">
                <h2>Plant World</h2>
                <p>Explore the fascinating world of plants and their properties</p>
            </div>

            <div class="carousel">
                <div class="carousel-container">
                    <div class="carousel-slide active">
                        <img src="photos/aloe.webp" alt="Medicinal Plants">
                        <div class="carousel-caption">
                            <h3>Medicinal Plants</h3>
                            <p>Discover nature's pharmacy</p>
                        </div>
                    </div>
                    <div class="carousel-slide">
                        <img src="photos/fruit-og-z8vk4201s653efw.jpg" alt="Fruits">
                        <div class="carousel-caption">
                            <h3>Fruits</h3>
                            <p>Nutritious and delicious</p>
                        </div>
                    </div>
                    <div class="carousel-slide">
                        <img src="photos/vegetables.webp" alt="Vegetables">
                        <div class="carousel-caption">
                            <h3>Vegetables</h3>
                            <p>Fresh and healthy</p>
                        </div>
                    </div>
                    <div class="carousel-slide">
                        <img src="photos/mixed-flower-bouquet-royalty-free-image-1728336500.avif" alt="Flowers">
                        <div class="carousel-caption">
                            <h3>Flowers</h3>
                            <p>Beauty in bloom</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-prev"><</button>
                <button class="carousel-next">></button>
                <div class="carousel-indicators">
                    <span class="indicator active" data-slide="0"></span>
                    <span class="indicator" data-slide="1"></span>
                    <span class="indicator" data-slide="2"></span>
                    <span class="indicator" data-slide="3"></span>
                </div>
            </div>

                    <path d="M93.781 51.578C95 50.969 96 49.359 96 48c0-1.375-1-2.969-2.219-3.578 0 0-22.868-1.514-31.781-10.422-8.915-8.91-10.438-31.781-10.438-31.781C50.969 1 49.375 0 48 0s-2.969 1-3.594 2.219c0 0-1.5 22.87-10.406 31.781-8.908 8.913-31.781 10.422-31.781 10.422C1 45.031 0 46.625 0 48c0 1.359 1 2.969 2.219 3.578 0 0 22.873 1.51 31.781 10.422 8.906 8.911 10.406 31.781 10.406 31.781C45.031 95 46.625 96 48 96s2.969-1 3.562-2.219c0 0 1.523-22.871 10.438-31.781 8.913-8.908 31.781-10.422 31.781-10.422Z" fill="#000"/>

                </svg>
                <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M93.781 51.578C95 50.969 96 49.359 96 48c0-1.375-1-2.969-2.219-3.578 0 0-22.868-1.514-31.781-10.422-8.915-8.91-10.438-31.781-10.438-31.781C50.969 1 49.375 0 48 0s-2.969 1-3.594 2.219c0 0-1.5 22.87-10.406 31.781-8.908 8.913-31.781 10.422-31.781 10.422C1 45.031 0 46.625 0 48c0 1.359 1 2.969 2.219 3.578 0 0 22.873 1.51 31.781 10.422 8.906 8.911 10.406 31.781 10.406 31.781C45.031 95 46.625 96 48 96s2.969-1 3.562-2.219c0 0 1.523-22.871 10.438-31.781 8.913-8.908 31.781-10.422 31.781-10.422Z" fill="#000"/>
                </svg>
                <!-- End sparkles -->
                <span>EXPLORE</span>
            </a>

            <div class="contributors">
                <div class="contributor" data-text="HARISHMA M">HARISHMA M</div>
                <div class="contributor" data-text="PAVITHRA M">PAVITHRA M</div>
                <div class="contributor" data-text="NANDHA KISHORE G">NANDHA KISHORE G</div>
                <div class="batch">Batch [2023]</div>
            </div>
        </div>

        <div id="plant-list-section" class="plant-list-section" style="display: none;">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search for a plant...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div id="plant-cards-container" class="plant-cards-container"></div>
        </div>
    </div>
    
    <!-- Modal for displaying plant details -->
    <div id="plant-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="plant-details"></div>
            <button id="download-pdf" class="download-btn">
                <i class="fas fa-file-pdf"></i>
                Download PDF
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
