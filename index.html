<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant-World</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="photos/KSRCT_LOGO_2.png" alt="KSR College of Technology">
        </div>

        <div class="main-content">
            <h1 class="project-title">Bioinformatics Project</h1>
            
            <div class="project-description">
                <h2>Plant World</h2>
                <p>Explore the fascinating world of plants and their properties</p>
            </div>

            <button id="explore-btn" class="explore-btn">
                <span>EXPLORE</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="contributors">
                <div class="contributor">HARISHMA M</div>
                <div class="contributor">PAVITHRA M</div>
                <div class="contributor">NANDHA KISHORE G</div>
                <div class="batch">Batch [2023]</div>
            </div>
        </div>

        <div id="plant-list-section" class="plant-list-section" style="display: none;">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search for a plant...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div id="plant-cards-container" class="plant-cards-container"></div>
        </div>
    </div>
    
    <!-- Modal for displaying plant details -->
    <div id="plant-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="plant-details"></div>
            <button id="download-pdf" class="download-btn">
                <i class="fas fa-file-pdf"></i>
                Download PDF
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
